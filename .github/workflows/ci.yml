name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore WinFormsPrintSample/WinFormsPrintSample.csproj

      - name: Build
        run: dotnet build WinFormsPrintSample/WinFormsPrintSample.csproj -c Release --no-restore
